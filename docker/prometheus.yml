global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000'] # 'api' is the service name, 8000 is its internal port

  - job_name: 'poller'
    metrics_path: /metrics
    static_configs:
      - targets: ['poller:8000'] # 'poller' service, internal port 8000

  - job_name: 'spark'
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark:4040'] # Spark driver's Prometheus endpoint (after configuration in Step 5)