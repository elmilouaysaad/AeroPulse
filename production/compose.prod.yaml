# =============================================================================
# AeroPulse — production overrides.
#
# Usage:
#   docker compose --env-file .env.prod \
#     -f compose.yaml -f compose.prod.yaml up -d
#
# Adds: restart policies, resource limits, log rotation, network segmentation,
# Docker secrets with entrypoint wrappers, image pinning. No host port
# exposure, no bind-mounted source, no build steps.
#
# Secrets used (create under `docker secret` or via an external orchestrator):
#   postgres_password, redis_password, qdrant_api_key,
#   airflow_password, airflow_fernet_key, airflow_secret_key,
#   grafana_password
#
# The entrypoint wrappers read the secret files from /run/secrets/ and export
# the environment variables the application already expects. This preserves
# the existing application code and still eliminates secrets from
# `docker inspect` output.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

x-postgres-secret: &postgres-secret
  secrets:
    - postgres_password

x-redis-secret: &redis-secret
  secrets:
    - redis_password

x-qdrant-secret: &qdrant-secret
  secrets:
    - qdrant_api_key

services:
  # ---------- Kafka (no secrets in this configuration; SASL is a next step) ---
  kafka-1:
    <<: *default-restart
    logging: *default-logging
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 2G }
        reservations: { cpus: '0.5', memory: 1G }

  kafka-2:
    <<: *default-restart
    logging: *default-logging
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 2G }
        reservations: { cpus: '0.5', memory: 1G }

  kafka-3:
    <<: *default-restart
    logging: *default-logging
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 2G }
        reservations: { cpus: '0.5', memory: 1G }

  kafka-init:
    <<: *default-restart
    logging: *default-logging

  # ---------- PostgreSQL ----------------------------------------------------
  postgres:
    <<: [*default-restart, *postgres-secret]
    image: postgres:16.2-alpine
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    deploy:
      resources:
        limits:      { cpus: '2.0', memory: 4G }
        reservations: { cpus: '0.5', memory: 1G }

  # ---------- Redis ---------------------------------------------------------
  redis:
    <<: [*default-restart, *redis-secret]
    image: redis:7.2-alpine
    logging: *default-logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" \
                          --protected-mode yes \
                          --bind 0.0.0.0
    deploy:
      resources:
        limits:      { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }

  # ---------- Qdrant --------------------------------------------------------
  qdrant:
    <<: [*default-restart, *qdrant-secret]
    image: qdrant/qdrant:v1.15.5
    logging: *default-logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_api_key)"
        exec "$$@"
      - --
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 2G }
        reservations: { cpus: '0.2', memory: 512M }

  # ---------- Spark ---------------------------------------------------------
  spark:
    <<: [*default-restart, *postgres-secret]
    image: registry.example.com/aeropulse/spark:3.5.3@sha256:REPLACE_ME
    build: null
    logging: *default-logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        exec "$$@"
      - --
    deploy:
      resources:
        limits:      { cpus: '2.0', memory: 4G }
        reservations: { cpus: '1.0', memory: 2G }

  # ---------- Poller --------------------------------------------------------
  poller:
    <<: [*default-restart, *postgres-secret]
    image: registry.example.com/aeropulse/poller:latest@sha256:REPLACE_ME
    build: null
    logging: *default-logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        exec "$$@"
      - --
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.2', memory: 256M }

  # ---------- Airflow -------------------------------------------------------
  # NOTE: `airflow standalone` is single-process. For real production,
  # split into webserver + scheduler + triggerer. Left as-is here to keep
  # the refactor scoped; see the closing notes.
  airflow:
    <<: *default-restart
    image: registry.example.com/aeropulse/airflow:2.10.0@sha256:REPLACE_ME
    build: null
    logging: *default-logging
    secrets:
      - postgres_password
      - redis_password
      - qdrant_api_key
      - airflow_password
      - airflow_fernet_key
      - airflow_secret_key
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://$${POSTGRES_USER}:$$(cat /run/secrets/postgres_password)@postgres:5432/aeropulse_airflow"
        export AIRFLOW__CORE__FERNET_KEY="$$(cat /run/secrets/airflow_fernet_key)"
        export AIRFLOW__WEBSERVER__SECRET_KEY="$$(cat /run/secrets/airflow_secret_key)"
        export AIRFLOW_PASSWORD="$$(cat /run/secrets/airflow_password)"
        export POSTGRES_DSN="postgresql://$${POSTGRES_USER}:$$(cat /run/secrets/postgres_password)@postgres:5432/$${POSTGRES_DB}"
        export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379/0"
        export QDRANT_API_KEY="$$(cat /run/secrets/qdrant_api_key)"
        exec "$$@"
      - --
    deploy:
      resources:
        limits:      { cpus: '2.0', memory: 4G }
        reservations: { cpus: '0.5', memory: 1G }

  # ---------- API -----------------------------------------------------------
  api:
    <<: *default-restart
    image: registry.example.com/aeropulse/api:0.5.0@sha256:REPLACE_ME
    build: null
    logging: *default-logging
    secrets:
      - postgres_password
      - redis_password
      - qdrant_api_key
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export POSTGRES_DSN="postgresql://$${POSTGRES_USER}:$$(cat /run/secrets/postgres_password)@postgres:5432/$${POSTGRES_DB}"
        export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379/0"
        export QDRANT_API_KEY="$$(cat /run/secrets/qdrant_api_key)"
        exec "$$@"
      - --
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.2', memory: 256M }

  # ---------- Dashboard -----------------------------------------------------
  dashboard:
    <<: *default-restart
    image: registry.example.com/aeropulse/dashboard:0.5.0@sha256:REPLACE_ME
    build: null
    logging: *default-logging
    deploy:
      resources:
        limits:      { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }

  # ---------- Observability -------------------------------------------------
  prometheus:
    <<: *default-restart
    image: prom/prometheus:v2.54.1
    logging: *default-logging
    deploy:
      resources:
        limits:      { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.2', memory: 256M }

  grafana:
    <<: *default-restart
    image: grafana/grafana-oss:11.2.0
    logging: *default-logging
    secrets:
      - grafana_password
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    deploy:
      resources:
        limits:      { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }

  loki:
    <<: *default-restart
    image: grafana/loki:3.1.1
    logging: *default-logging
    deploy:
      resources:
        limits:      { cpus: '0.5', memory: 1G }

  promtail:
    <<: *default-restart
    image: grafana/promtail:3.1.1
    logging: *default-logging

# -----------------------------------------------------------------------------
# Docker secrets (must be pre-created; Docker Swarm or an orchestrator).
# -----------------------------------------------------------------------------
secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  qdrant_api_key:
    external: true
  airflow_password:
    external: true
  airflow_fernet_key:
    external: true
  airflow_secret_key:
    external: true
  grafana_password:
    external: true