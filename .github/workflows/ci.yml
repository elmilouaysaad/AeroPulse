name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest tests/ -v -m "not integration" --cov=src --cov-report=term

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aeropulse
          POSTGRES_PASSWORD: aeropulse
          POSTGRES_DB: aeropulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeropulse -d aeropulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Init Postgres schema
        env:
          PGPASSWORD: aeropulse
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -p 5432 -U aeropulse -d aeropulse -f docker/postgres-init.sql
          psql -h localhost -p 5432 -U aeropulse -d aeropulse -c "\dt"

      - name: Integration tests
        env:
          POSTGRES_DSN: postgresql://aeropulse:aeropulse@localhost:5432/aeropulse
        run: pytest tests/integration/ -v -m integration

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aeropulse-poller:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max